<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>kyoheichanのホームページ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.8;
      color: #333;
      background-color: #f5f5f5;
    }

    header {
      padding: 60px 20px;
      text-align: center;
      color: white;
      background-color: #26364a;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin-top: 10px;
    }

    nav {
      padding: 12px;
      text-align: center;
      background-color: white;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      margin: 0 12px;
      color: #26364a;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 30px;
      background-color: white;
      border-radius: 8px;
    }

    section {
      margin-bottom: 45px;
    }

    h2 {
      padding-bottom: 8px;
      border-bottom: 2px solid #26364a;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #666;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      main {
        margin: 15px;
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>kyoheichanのホームページ</h1>
    <p>研究・制作物・活動内容を紹介します</p>
  </header>

  <nav>
    <a href="#profile">自己紹介</a>
    <a href="#research">研究</a>
    <a href="#works">制作物</a>
    <a href="#contact">連絡先</a>
  </nav>

  <main>
    <section id="profile">
      <h2>自己紹介</h2>
    </section>

    <section id="research">
      <h2>研究内容</h2>
    </section>

    <section id="works">
      <h2>制作物</h2>

      <h3>制作物1</h3>
      <p>ここに制作物の説明を書きます。</p>

      <h3>制作物2</h3>
      <p>ここにプログラムや作品の説明を書きます。</p>
    </section>

    <section id="contact">
      <h2>連絡先</h2>
      <p>
        連絡先は準備中です。
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 kyoheichan</p>
  </footer>
</body>
</html>
